id: zpa-private-service-edge            # [a-z0-9-]+, matches the directory name
name: ZPA Private Service Edge lab
provider: aws                           # must be a registered provider id
summary: A Private Service Edge in an isolated VPC, plus a segmented client/server VPC.
description: |                          # markdown; the card shows it
  A reproducible **Zscaler Private Access — Private Service Edge** built end to end
  in AWS `eu-central-1`: two isolated VPCs, three network zones, and unattended
  provisioning-key enrolment. Source:
  [zs-zpa-private-service-edge-lab](https://github.com/nilsujma-dev/zs-zpa-private-service-edge-lab).

  The drawing above is generated from the live AWS inventory: boxes and lines come from
  AWS, the dashed flows and the blocked pair are declared in this manifest. Hover anything
  for its facts; click it to open the region drawer.

  ## What turning it on does

  1. **Create ZPA groups and keys** — a Service Edge Group, an App Connector Group
     and their provisioning keys in the ZPA tenant, all prefixed `AWS-Lab`. A
     SHA-hashed baseline of the tenant is taken first and verified afterwards so
     the run can prove it touched nothing else.
  2. **Create PRIV connector group** — the second App Connector Group and key for
     the PRIV zone.
  3. **Prune stale entries** — stale entries from earlier rebuilds are pruned
     before apply, so nothing the lab waits on can latch onto a dead record.
     Ownership is decided by membership of the `AWS-Lab` groups, never by an
     entry's name and never by its status; an authenticated entry is kept and
     reported, never deleted.
  4. **Seed provisioning keys into SSM** — the keys go straight from ZPA into SSM
     Parameter Store as `SecureString`. They are never written to disk, never put
     in `user_data`, never stored in OpenTofu state.
  5. **Apply infrastructure** — `tofu apply` builds both VPCs, subnets, routing,
     security groups, the NAT gateway, elastic IPs and the five instances. Each
     instance reads its own key from SSM at boot through its IAM role and
     self-enrols; no OAuth code, no console login.
  6. **Wait for enrolment** — polls ZPA until the Service Edge and both App
     Connectors report `ZPN_STATUS_AUTHENTICATED` (up to 15 minutes).

  Every rebuild consumes one use of each provisioning key. **Nothing accumulates:**
  stale entries are pruned at OFF and again before ON, and the status probe carries
  the count that is left.

  ## What turning it off does

  `tofu destroy` removes **every AWS resource** in the lab: instances, volumes, NAT
  gateway, elastic IPs, subnets and both VPCs. Nothing keeps billing.

  **The ZPA groups and keys deliberately survive**; the entries enrolled inside them
  do not. They live outside OpenTofu, so a prune step runs after the destroy: stale
  disconnected entries in the lab's own groups are deleted, and anything it cannot
  prove is the lab's own is left alone and reported.

  ## Cost

  About **$285/month** at on-demand list price while on (EC2 for the five
  instances, the NAT gateway, elastic IPs and gp3 volumes; NAT data processing not
  included). There is **no vendor licensing cost**: the ZPA AMIs carry no
  marketplace product code and bill as plain `RunInstances`. When off, the AWS
  spend is zero. The Clouds page shows the live figure under `Project=zpa-pse-lab`.

  ## Sharing

  The lab is self-contained. The one thing it shares with other work is the ZPA
  tenant, because a tenant is an account-level object and that is where the
  credentials point. No VPC, subnet, application segment, server group or access
  policy is shared with anything else.
source:
  git: https://github.com/nilsujma-dev/zs-zpa-private-service-edge-lab.git
  ref: main
terraform:
  dir: terraform                        # relative to checkout
  state_key: usecases/zpa-private-service-edge/terraform.tfstate
env:                                    # non-secret, applied to every step
  AWS_DEFAULT_REGION: eu-central-1
secrets:                                # host-provided; engine maps these in
  - zscaler_oneapi                      # -> ZS_ISSUER, ZS_CLIENT_ID, ZPA_CUSTOMER_ID env
                                        #    + ~/.zscaler_api_key symlink to the mounted secret
"on":                                   # ordered; stop on first failure (quoted: YAML 1.1 reads bare on/off as booleans)
  - name: Create ZPA groups and keys
    run: python3 scripts/zpa_create.py
  - name: Create PRIV connector group
    run: python3 scripts/zpa_create_priv.py
  - name: Prune stale entries
    run: python3 scripts/prune.py --phase on-pre --apply
  - name: Seed provisioning keys into SSM
    run: python3 scripts/put_keys_ssm.py
  - name: Apply infrastructure
    run: tofu -chdir=terraform apply -auto-approve -input=false
  - name: Wait for enrolment
    run: python3 scripts/wait_enrolled.py --timeout 900
"off":
  - name: Destroy infrastructure
    run: tofu -chdir=terraform destroy -auto-approve -input=false
  - name: Prune stale entries
    run: python3 scripts/prune.py --phase off --apply
status:                                 # optional; must print JSON on stdout
  run: python3 scripts/status.py --json
  interval_s: 60
tags:                                   # inventory grouping + cost attribution
  Project: zpa-pse-lab

effects:                                # what happens OUTSIDE OpenTofu; the live plan supplies the rest
  "on":
    creates:
      - "ZPA Service Edge Group, App Connector Groups and provisioning keys — reused by name if they already exist, never duplicated"
      - "Three SSM SecureString parameters under /zpa-lab/ holding the provisioning keys (overwritten on every run)"
      - "An enrolled Service Edge and two App Connectors in ZPA once the instances boot and dial in (~3 minutes)"
      - "Nothing accumulates: stale entries from earlier rebuilds are pruned before apply — inside the AWS-Lab groups only, decided by group membership, with the candidate list in the job log"
    retains: []
  "off":
    destroys:
      - "Everything OpenTofu manages in this use case: both VPCs and all their subnets, routes, NACLs and security groups, the NAT gateway, both elastic IPs, all five instances and their volumes, the IAM role and instance profile — see the plan"
      - "The disconnected Service Edge and App Connector entries of this run: after the destroy, stale disconnected entries in the lab's own groups are deleted, one DELETE per entry in the log"
    retains:
      - "ZPA Service Edge Group, App Connector Groups and provisioning keys — deleting these is deliberately manual"
      - "Any lab entry the prune deliberately kept (still authenticated, too young, or an ownership check that was not unambiguous) — the status probe counts it under stale and the next ON prunes it before apply"
      - "The three SSM parameters under /zpa-lab/ (harmless; overwritten on the next ON)"
      - "The S3 state object (versioned, so this OFF is recoverable) and the remote lock"

topology:                               # structure comes from AWS; these give it meaning
  roles:
    zpa-lab-pse: pse
    zpa-lab-connector: connector
    zpa-lab-priv-connector: connector
    zpa-lab-server: app
    zpa-lab-mcu-client: client
  flows:
    - {from: zpa-lab-mcu-client,     to: zpa-lab-pse,    label: "dials :443",         via: [nat, internet]}
    - {from: zpa-lab-priv-connector, to: zpa-lab-pse,    label: "dials :443",         via: [nat, internet]}
    - {from: zpa-lab-connector,      to: zpa-lab-pse,    label: "dials :443 (local)"}
    - {from: zpa-lab-priv-connector, to: zpa-lab-server, label: ":8080 brokered"}
    - {from: zpa-lab-pse,            to: internet,       label: "control plane :443"}
  blocked:
    - {from: zpa-lab-mcu-client, to: zpa-lab-server, label: "no route"}
