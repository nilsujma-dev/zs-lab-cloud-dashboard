<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Switchboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d0f12'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23f5b544' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23f5b544'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-plug" viewBox="0 0 24 24">
      <path d="M8 3v5M16 3v5" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
      <path d="M5 8h14v3a7 7 0 0 1-14 0z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      <path d="M12 18v3" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
    </symbol>
    <symbol id="i-jack" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
      <circle cx="12" cy="12" r="3" fill="currentColor"/>
    </symbol>
    <symbol id="i-chev" viewBox="0 0 24 24">
      <path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24">
      <path d="M20 12a8 8 0 1 1-2.3-5.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path d="M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-check" viewBox="0 0 24 24">
      <path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-x" viewBox="0 0 24 24">
      <path d="M7 7l10 10M17 7L7 17" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-file" viewBox="0 0 24 24">
      <path d="M7 3h7l5 5v13H7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M14 3v5h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-folder" viewBox="0 0 24 24">
      <path d="M3 6h6l2 2h10v11H3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-code" viewBox="0 0 24 24">
      <path d="M8 7l-5 5 5 5M16 7l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>
</svg>

<div id="app" class="app">
  <header class="topbar" id="topbar" hidden>
    <a class="wordmark" href="#/clouds" aria-label="Switchboard home">
      <svg class="wordmark-mark" aria-hidden="true"><use href="#i-jack"/></svg>
      <span class="wordmark-text">Switchboard</span>
    </a>
    <nav class="nav" aria-label="Pages">
      <a class="nav-link" href="#/clouds" data-route="clouds">Clouds</a>
      <a class="nav-link" href="#/usecases" data-route="usecases">Use cases</a>
    </nav>
    <div class="topbar-right">
      <span class="badge badge-mock" id="mock-badge" hidden title="Fixture data — no backend calls">MOCK</span>
      <button class="btn btn-ghost" id="signout" type="button">Sign out</button>
    </div>
  </header>
  <main id="view" class="view" tabindex="-1"></main>
</div>
<div id="modal-root"></div>
<div id="toast-root" class="toast-root" aria-live="polite"></div>
<noscript><p class="noscript">Switchboard needs JavaScript enabled.</p></noscript>
<script src="app.js"></script>
</body>
</html>
